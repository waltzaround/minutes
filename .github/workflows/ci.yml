name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon
            llama: macos-arm64
            bundle: dmg
          - os: windows-2022      # x86_64, VS 2022
            llama: win-x64
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Cache Windows C++ dependencies
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-windows-2022-${{ hashFiles('scripts/build-nemo-speech.mjs') }}

      - run: pnpm install --frozen-lockfile
      - name: Fetch pinned llama.cpp runtime (SHA-256 verified)
        run: node scripts/fetch-llama.mjs ${{ matrix.llama }}
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          path-type: inherit
          install: mingw-w64-x86_64-gcc make diffutils
      - name: Build bundled FFmpeg decoder (macOS, pinned source)
        if: runner.os == 'macOS'
        run: node scripts/build-ffmpeg.mjs macos-arm64
      - name: Build bundled FFmpeg decoder (Windows, pinned source)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: node scripts/build-ffmpeg.mjs win-x64

      - name: Build tools for NeMo-Speech.cpp (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Build tools for NeMo-Speech.cpp (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y ninja
          vcpkg install sentencepiece:x64-windows-static --classic
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
      - name: Build pinned NeMo-Speech.cpp diarization runtime
        run: node scripts/build-nemo-speech.mjs

      - name: Frontend typecheck and tests
        run: |
          pnpm typecheck
          pnpm test

      - name: Rust tests (unit + mocked integrations; hardware/model tests are #[ignore])
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build installers (unsigned)
        run: pnpm tauri build --bundles ${{ matrix.bundle }}

      - name: Prepare downloads and checksums
        run: node scripts/prepare-release.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: minutes-${{ matrix.llama }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      GH_REPO: waltzaround/minutes-releases
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: minutes-*
          path: dist-release
          merge-multiple: true
      - name: Publish public downloads
        shell: bash
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo 'Builds are ready as workflow artifacts. Add RELEASE_TOKEN with Contents write access to minutes-releases for automatic publishing.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "$RELEASE_TAG" dist-release/* --title "Minutes ${RELEASE_TAG#v} (preview)" --notes-file "docs/releases/$RELEASE_TAG.md" --latest
