[env]
# ts-rs: export TypeScript bindings into the frontend and map u64 to number
# (all our u64 values are byte counts well below 2^53).
TS_RS_EXPORT_DIR = { value = "../src/lib/types/generated", relative = true }
TS_RS_LARGE_INT = "number"

# sherpa-onnx ships its Windows static libraries built with the static CRT
# (/MT). Link the whole app against the static CRT to match; this also
# removes the need for the VC++ redistributable on user machines.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
